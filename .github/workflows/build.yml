name: Build Multi-Platform

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release from this run"
        type: boolean
        default: false
      tag_name:
        description: "Release tag (e.g. v1.0.3) — required when create_release is true"
        type: string
        required: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows

          - os: ubuntu-latest
            platform: linux

          - os: macos-latest
            platform: macos

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC (Windows only)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install dependencies (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Install dependencies (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Stage addon for upload
      shell: bash
      run: |
        mkdir -p artifact
        cp -r build/deploy/addons artifact/
        echo "=== Artifact contents ==="
        ls -lR artifact/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}-build
        path: artifact/
        retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Resolve release tag
      id: meta
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "::error::tag_name input is required when create_release=true"
            exit 1
          fi
        else
          TAG="${{ github.ref_name }}"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "zip=dungeon-generator-${TAG}.zip" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Merge platform artifacts into release tree
      shell: bash
      run: |
        mkdir -p release
        # Any one artifact has the shared addon files; use linux-build as source of truth.
        cp -r artifacts/linux-build/addons release/
        # Overlay each platform's bin/ directory onto the shared tree.
        cp -rn artifacts/windows-build/addons/dungeon_generator/bin/. release/addons/dungeon_generator/bin/
        cp -rn artifacts/macos-build/addons/dungeon_generator/bin/.   release/addons/dungeon_generator/bin/
        echo "=== Final release tree ==="
        find release -type f
        cd release
        zip -r "../${{ steps.meta.outputs.zip }}" addons/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        files: ${{ steps.meta.outputs.zip }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
